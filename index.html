  if (mode === 'syncing')      el.innerHTML = '<span class="dot spin-dot"></span> Menyinkronkan…';
  else if (mode === 'pending') el.innerHTML = '<span class="dot spin-dot"></span> Menunggu sinkron';
  else if (mode === 'error')   el.innerHTML = '<span class="dot err"></span> Gagal sinkron';
  else if (mode === 'new')     el.innerHTML = '<span class="dot new"></span> Data baru';
  else if (mode === 'offline') el.innerHTML = '<span class="dot"></span> Mode Lokal';
  else                         el.innerHTML = '<span class="dot ok"></span> Tersinkron';
}
function toast(msg, type){

  var icons = { success: '✅', error: '⚠️', info: 'ℹ️', newmsg: '📨' };
  try {
    var el = document.createElement('div');

    var box = document.getElementById('toasts'); if (!box) return;
    box.appendChild(el);
    setTimeout(function(){ el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; setTimeout(function(){ try { el.remove(); } catch (e){} }, 320); }, 3000);
  } catch (e){}

function busy(on, text){

/* ================================================================

function supabaseConfigured(){
  return (typeof window.supabase !== 'undefined')
      && SUPABASE_URL.indexOf('http') === 0
      && SUPABASE_URL.indexOf('GANTI') === -1
      && SUPABASE_ANON_KEY.indexOf('GANTI') === -1
      && SUPABASE_ANON_KEY.length > 20;
}
function initSupabase(){
  if (!supabaseConfigured()){ console.warn('[Supabase] belum dikonfigurasi'); setSync('offline'); return; }
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch (e){ console.error('[Supabase]', e); setSync('error'); return; }
  ONLINE = true; setSync('syncing');
  flushQueue().then(function(){ return loadAll(true); }).then(function(){ subscribeRealtime(); })
    .catch(function(e){ console.error('[Supabase] init gagal:', e); setSync('error'); });
}
function loadAll(initial){
  if (!sb) return Promise.resolve();
  setSync('syncing');
  return Promise.all([
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('guru').select('*').order('urut', { ascending: true }).order('nama', { ascending: true }),
    sb.from('absensi').select('*').order('created_at', { ascending: false })
  ]).then(function(res){
    var e0 = res[0].error, e1 = res[1].error, e2 = res[2].error;
    if (e0 || e1 || e2) throw (e0 || e1 || e2);
    var st = res[0].data;
    if (st){
      DB.settings.adminUser  = st.admin_user  || DB.settings.adminUser;
      DB.settings.adminPass  = st.admin_pass  || DB.settings.adminPass;
      DB.settings.theme      = st.theme       || DB.settings.theme;
      DB.settings.activeYear = st.active_year || DB.settings.activeYear;
      if (Array.isArray(st.years) && st.years.length) DB.settings.years = st.years;
      if (st.kop && typeof st.kop === 'object') DB.settings.kop = Object.assign(DB.settings.kop, st.kop);
    }
    DB.guru = (res[1].data || []).map(function(r){ return { id: r.id, nama: r.nama, jk: r.jk }; });
    DB.absensi = (res[2].data || []).map(function(r){
      return { id: r.id, guruId: r.guru_id, nama: r.nama, jk: r.jk, tanggal: r.tanggal, status: r.status, createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now() };
    });
    applyTheme(); saveDB(); setSync('synced');
    if (initial) render(); else softRefresh();
  }).catch(function(err){
    console.error('[Supabase] loadAll gagal:', err); setSync('error'); if (initial) render();
  });
}
function subscribeRealtime(){
  if (!sb) return;
  try {
    sb.channel('odhj-absensi')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'absensi' }, function(p){
        if (Date.now() - _localActionAt < 1500) return;   /* ← skip realtime untuk aksi lokal */
        var r = p.new; if (!r || !r.id) return;
        if (DB.absensi.some(function(x){ return x.id === r.id; })) return;
        var entry = { id: r.id, guruId: r.guru_id, nama: r.nama, jk: r.jk, tanggal: r.tanggal, status: r.status, createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now() };
        DB.absensi.push(entry); saveDB();
        toast('📩 ' + entry.nama + ' • ' + (STATUS_LABEL[entry.status] || entry.status) + ' • ' + fmtShort(entry.tanggal), 'newmsg');
        setSync('new'); setTimeout(function(){ setSync('synced'); }, 1600);
        softRefresh();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'absensi' }, function(p){
        if (Date.now() - _localActionAt < 1500) return;
        var id = p.old && p.old.id; if (!id) return;
        var before = DB.absensi.length;
        DB.absensi = DB.absensi.filter(function(x){ return x.id !== id; });
        if (DB.absensi.length !== before){ saveDB(); softRefresh(); }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'guru' }, function(){
        if (Date.now() - _localActionAt < 1500) return;   /* ← skip realtime untuk aksi lokal */
        loadAll(false);
      })
      .subscribe(function(status){ console.log('[Supabase Realtime]', status); });
  } catch (e){ console.warn('Realtime gagal:', e); }
}

/* ---------- ANTREAN TULIS ---------- */
function readQueue(){ try { return JSON.parse(localStorage.getItem(LS_QUEUE) || '[]'); } catch (e){ return []; } }
function writeQueue(q){ try { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); } catch (e){} }
function queueOp(op){ var q = readQueue(); q.push(op); writeQueue(q); setSync('pending'); }
function pendingCount(){ return readQueue().length; }
function flushQueue(){
  if (!sb) return Promise.resolve();
  var q = readQueue(); if (!q.length) return Promise.resolve();
  var rest = [], chain = Promise.resolve();
  q.forEach(function(op){
    chain = chain.then(function(){ return runOp(op).catch(function(err){ console.warn('Antrean gagal:', err); rest.push(op); }); });
  });
  return chain.then(function(){ writeQueue(rest); setSync(rest.length ? 'pending' : 'synced'); });
}
function runOp(op){
  if (!sb) return Promise.reject(new Error('offline'));
  if (op.type === 'upsertGuru'){
    if (!op.rows || !op.rows.length) return Promise.resolve();
    return sb.from('guru').upsert(op.rows, { onConflict: 'id' }).then(checkErr);
  }
  if (op.type === 'deleteGuru'){ if (!op.ids || !op.ids.length) return Promise.resolve(); return sb.from('guru').delete().in('id', op.ids).then(checkErr); }
  if (op.type === 'insertAbsensi'){ return sb.from('absensi').upsert(op.row, { onConflict: 'guru_id,tanggal', ignoreDuplicates: true }).then(checkErr); }
  if (op.type === 'deleteAbsensi'){ if (!op.ids || !op.ids.length) return Promise.resolve(); return sb.from('absensi').delete().in('id', op.ids).then(checkErr); }
  if (op.type === 'deleteAbsensiRange'){ return sb.from('absensi').delete().gte('tanggal', op.from).lte('tanggal', op.to).then(checkErr); }
  if (op.type === 'saveSettings'){ return sb.from('settings').upsert(op.row, { onConflict: 'id' }).then(checkErr); }
  return Promise.resolve();
}
function checkErr(res){ if (res && res.error) throw res.error; return res; }
function push(op){
  if (!sb){ queueOp(op); return; }
  setSync('syncing');
  runOp(op).then(function(){ if (!pendingCount()) setSync('synced'); else flushQueue(); })
           .catch(function(err){ console.warn('Push gagal:', err); queueOp(op); });
}

/* ---------- EVENT DELEGATION — inti perbaikan ---------- */
function installContentDelegation(c){
  if (!c || c._delegated) return;
  c._delegated = true;
  c.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;

    var el;
    el = t.closest('[data-edit]');
    if (el){ e.preventDefault(); guruForm(el.getAttribute('data-edit')); return; }

    el = t.closest('[data-del]');
    if (el){ e.preventDefault(); deleteGuruById(el.getAttribute('data-del')); return; }

    el = t.closest('[data-delentry]');
    if (el){ e.preventDefault(); deleteEntryById(el.getAttribute('data-delentry')); return; }
  });
}

function paintAdminPage(c, page){
  if (page === 'dashboard') pageDashboard(c);
  else if (page === 'guru') pageGuru(c);
  else if (page === 'laporan') pageLaporan(c);
  else if (page === 'absensi') pageAbsensi(c);
  else if (page === 'pengaturan') pagePengaturan(c);
  else pageDashboard(c);
}

/* ---------- DASHBOARD ---------- */
function countStatus(from, to){
  var list = (DB.absensi || []).filter(function(a){ return a.tanggal >= from && a.tanggal <= to; });
  return {
    tilawah: list.filter(function(a){ return a.status === 'tilawah'; }).length,
    tidak: list.filter(function(a){ return a.status === 'tidak'; }).length,
    haid: list.filter(function(a){ return a.status === 'haid'; }).length,
    total: list.length
  };
}
function ranking(from, to){
  var map = {};
  (DB.guru || []).forEach(function(g){ map[g.id] = { guru: g, tilawah: 0, tidak: 0, haid: 0, total: 0 }; });
  (DB.absensi || []).forEach(function(a){
    if (a.tanggal < from || a.tanggal > to) return;
    var r = map[a.guruId];
    if (!r){ r = { guru: { id: a.guruId, nama: a.nama, jk: a.jk }, tilawah: 0, tidak: 0, haid: 0, total: 0 }; map[a.guruId] = r; }
    if (a.status === 'tilawah') r.tilawah++;
    else if (a.status === 'tidak') r.tidak++;
    else if (a.status === 'haid') r.haid++;
    r.total++;
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function pageDashboard(c){
  var today = todayStr(), ym = today.slice(0, 7);
  var from = ym + '-01', to = ym + '-' + pad(lastDayOfMonth(ym));
  var t = countStatus(today, today), m = countStatus(from, to);
  var tahun = DB.settings.activeYear + '-01-01', tahunEnd = DB.settings.activeYear + '-12-31';
  var y = countStatus(tahun, tahunEnd);
  var days = [];
  for (var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    var key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    days.push({ key: key, lbl: HARI[d.getDay()].slice(0, 3), n: (DB.absensi || []).filter(function(a){ return a.tanggal === key && a.status === 'tilawah'; }).length });
  }
  var maxD = 1; days.forEach(function(d){ if (d.n > maxD) maxD = d.n; });
  var top = ranking(tahun, tahunEnd).filter(function(r){ return r.tilawah > 0; })
    .sort(function(a, b){ return b.tilawah - a.tilawah || a.guru.nama.localeCompare(b.guru.nama); }).slice(0, 5);
  var chartHTML = days.map(function(d){ return '<div class="col"><div class="bar" style="height:' + Math.round(d.n / maxD * 100) + '%"><span>' + d.n + '</span></div><div class="lbl">' + d.lbl + '</div></div>'; }).join('');
  var topHTML = top.length ? top.map(function(r, i){
    var cls = i === 0 ? '' : (i === 1 ? 'silver' : (i === 2 ? 'bronze' : 'plain'));
    return '<div class="rank-item"><div class="rank-no ' + cls + '">' + (i + 1) + '</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">' + esc(r.guru.nama) + '</div><div class="muted" style="font-size:12px">' + (r.guru.jk === 'P' ? 'Akhwat' : 'Ikhwan') + '</div></div><div style="text-align:right"><div style="font-weight:800;color:var(--green)">' + r.tilawah + '</div><div class="muted" style="font-size:11px">tilawah</div></div></div>';
  }).join('') : '<p class="muted">Belum ada data tilawah.</p>';
  c.innerHTML = ''
    + '<div class="grid-stats">'
    + '<div class="stat g1"><div class="ic">👥</div><b>' + DB.guru.length + '</b><small>Total Guru / Staf</small></div>'
    + '<div class="stat g5"><div class="ic">📖</div><b>' + t.tilawah + '</b><small>Tilawah Hari Ini</small></div>'
    + '<div class="stat g3"><div class="ic">⏳</div><b>' + t.tidak + '</b><small>Tidak Tilawah Hari Ini</small></div>'
    + '<div class="stat g4"><div class="ic">🩸</div><b>' + t.haid + '</b><small>Haid Hari Ini</small></div>'
    + '<div class="stat g2"><div class="ic">📅</div><b>' + m.tilawah + '</b><small>Tilawah Bulan Ini</small></div>'
    + '<div class="stat g6"><div class="ic">🏆</div><b>' + y.tilawah + '</b><small>Tilawah Tahun ' + DB.settings.activeYear + '</small></div>'
    + '</div>'
    + '<div class="card" style="margin-top:16px"><h3 class="st">📈 Grafik Tilawah 7 Hari Terakhir</h3><div class="chart">' + chartHTML + '</div></div>'
    + '<div class="card"><h3 class="st">🏅 Guru Paling Rajin (Tahun ' + DB.settings.activeYear + ')</h3>' + topHTML + '</div>';
}

  /* NOTE: [data-edit] dan [data-del] TIDAK di-bind di sini — ditangani oleh event delegation di #content */

function moveGuru(id, newIndex){
  var i = -1;
  for (var k = 0; k < DB.guru.length; k++) if (DB.guru[k].id === id){ i = k; break; }
  if (i < 0) return;
  var item = DB.guru.splice(i, 1)[0];
  newIndex = Math.max(0, Math.min(DB.guru.length, newIndex));
  DB.guru.splice(newIndex, 0, item);
  markLocal(); saveDB();
  push({ type: 'upsertGuru', rows: guruRows() });
  var c = $('#content'); if (c) pageGuru(c);
}

function importDialog(){
  openModal(
    '<h3 class="st">📥 Import Excel / CSV</h3><p class="muted" style="font-size:13px">Format: Nama | JK (L/P). Baris pertama boleh header.</p>'
    + '<div class="drop-zone" id="dz"><div style="font-size:34px">📄</div><div style="font-weight:700;margin-top:6px">Tarik file atau klik</div><div style="font-size:12px">.xlsx, .xls, .csv</div></div>'
    + '<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">'
    + '<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-cancel>Tutup</button></div>',
    function(bg){
      var dz = bg.querySelector('#dz'), fi = bg.querySelector('#fileInput');
      bg.querySelector('[data-cancel]').addEventListener('click', closeModal);
      dz.addEventListener('click', function(){ fi.click(); });
      dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('hover'); });
      dz.addEventListener('dragleave', function(){ dz.classList.remove('hover'); });
      dz.addEventListener('drop', function(e){ e.preventDefault(); dz.classList.remove('hover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
      fi.addEventListener('change', function(){ if (fi.files[0]) handleFile(fi.files[0]); });
      function handleFile(file){
        busy(true, 'Membaca file…');
        var reader = new FileReader();
        reader.onload = function(ev){
          var rows = [];
          try {
            if (typeof XLSX !== 'undefined'){
              var wb = XLSX.read(ev.target.result, { type: 'binary' });
              var ws = wb.Sheets[wb.SheetNames[0]];
              rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });
            } else {
              var text = (typeof ev.target.result === 'string') ? ev.target.result : new TextDecoder().decode(ev.target.result);
              rows = text.split(/\r?\n/).filter(Boolean).map(function(l){ return l.split(/[;,\t]/); });
            }
          } catch (err){ busy(false); toast('Gagal membaca file', 'error'); return; }
          busy(false); closeModal();
          var added = importRows(rows);
          toast(added ? added + ' data diimport' : 'Tidak ada data baru', added ? 'success' : 'info');
          var cc = $('#content'); if (cc) pageGuru(cc);
        };
        if (typeof XLSX !== 'undefined') reader.readAsBinaryString(file);
        else reader.readAsText(file);
      }
    }
  );
}

function importRows(rows){
  var added = 0;
  rows.forEach(function(r, idx){
    if (!r) return;
    var nama = String(r[0] == null ? '' : r[0]).trim();
    if (!nama) return;
    if (idx === 0 && /^(nama|name)/i.test(nama)) return;
    var jkRaw = String(r[1] == null ? '' : r[1]).trim().toUpperCase();
    var jk = /^(P|PEREMPUAN|AKHWAT|WANITA|F|FEMALE)/.test(jkRaw) ? 'P' : 'L';
    if (DB.guru.some(function(g){ return g.nama.toLowerCase() === nama.toLowerCase(); })) return;
    DB.guru.push({ id: uid(), nama: nama, jk: jk });
    added++;
  });
  if (added){ markLocal(); saveDB(); push({ type: 'upsertGuru', rows: guruRows() }); }
  return added;
}

/* ---------- LAPORAN ---------- */
var repState = {
  type: 'rekap', mode: 'bulanan',
  date: todayStr(), from: todayStr(), to: todayStr(),
  month: todayStr().slice(0, 7), year: new Date().getFullYear(),
  sort: 'newest', pageSize: 10, page: 1, result: null, guruFilter: 'all'
};

function getRange(){
  var m = repState.mode;
  if (m === 'harian') return { from: repState.date, to: repState.date };
  if (m === 'rentang') return { from: repState.from, to: repState.to };
  if (m === 'bulanan'){ var d = lastDayOfMonth(repState.month); return { from: repState.month + '-01', to: repState.month + '-' + pad(d) }; }
  return { from: repState.year + '-01-01', to: repState.year + '-12-31' };
}
function sortByGuruOrder(arr){
  var order = {}; DB.guru.forEach(function(g, i){ order[g.id] = i; });
  arr.sort(function(a, b){ var oa = (order[a.guru.id] == null ? 99999 : order[a.guru.id]); var ob = (order[b.guru.id] == null ? 99999 : order[b.guru.id]); return oa - ob; });
  return arr;
}
function buildResult(){
  var r = getRange(), from = r.from, to = r.to;
  if (repState.type === 'detail'){
    var rows = DB.absensi.filter(function(a){ return a.tanggal >= from && a.tanggal <= to; });
    rows.sort(function(a, b){ return repState.sort === 'newest' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt; });
    return { type: 'detail', from: from, to: to, rows: rows };
  }
  var all = ranking(from, to);
  var filledArr = all.filter(function(x){ return x.total > 0; });
  var emptyArr = all.filter(function(x){ return x.total === 0; });
  var summary = { total: all.length, filled: filledArr.length, empty: emptyArr.length };
  if (repState.type === 'belum'){ sortByGuruOrder(emptyArr); return { type: 'belum', from: from, to: to, rows: emptyArr, summary: summary }; }
  var filtered = all.slice();
  if (repState.guruFilter === 'filled') filtered = filtered.filter(function(x){ return x.total > 0; });
  else if (repState.guruFilter === 'empty') filtered = filtered.filter(function(x){ return x.total === 0; });
  if (repState.type === 'gender'){
    var rowsL = filtered.filter(function(x){ return x.guru.jk === 'L'; });
    var rowsP = filtered.filter(function(x){ return x.guru.jk === 'P'; });
    sortByGuruOrder(rowsL); sortByGuruOrder(rowsP);
    return { type: 'gender', from: from, to: to, rowsL: rowsL, rowsP: rowsP, summary: summary };
  }
  if (repState.type === 'peringkat'){
    filtered.sort(function(a, b){ return b.tilawah - a.tilawah || (b.total ? b.tilawah / b.total : 0) - (a.total ? a.tilawah / a.total : 0) || a.guru.nama.localeCompare(b.guru.nama); });
    return { type: 'peringkat', from: from, to: to, rows: filtered, summary: summary };
  }
  sortByGuruOrder(filtered);
  return { type: 'rekap', from: from, to: to, rows: filtered, summary: summary };
}

      + '<p class="muted">' + (res.type === 'belum' ? '🎉 Semua guru sudah mengisi.' : 'Tidak ada data.') + '</p>';

  }
  var per = repState.pageSize === 'all' ? rows.length : repState.pageSize;

      markLocal();
      s.years.forEach(function(x){ x.active = (x.year === y); });
      s.activeYear = y; saveDB(); toast('Tahun aktif: ' + y, 'success');
      pagePengaturan(c);
      push({ type: 'saveSettings', row: settingsRow() });
    });
  });
  $$('[data-delyear]').forEach(function(b){
    b.addEventListener('click', function(){
      var y = parseInt(b.getAttribute('data-delyear'), 10);
      if (!confirm('Hapus tahun ' + y + '?')) return;
      markLocal();
      s.years = s.years.filter(function(x){ return x.year !== y; });
      if (!s.years.some(function(x){ return x.active; }) && s.years[0]) s.years[0].active = true;
      var active = s.years.filter(function(x){ return x.active; })[0] || s.years[0];
      s.activeYear = active.year; saveDB(); toast('Tahun dihapus', 'success');
      pagePengaturan(c);
      push({ type: 'saveSettings', row: settingsRow() });
    });
  });
  $('#btnSaveAcc').addEventListener('click', function(){
    var u = $('#setUser').value.trim(), p1 = $('#setPass').value, p2 = $('#setPass2').value;
    if (!u){ toast('Username wajib', 'error'); return; }
    if (p1 || p2){ if (p1 !== p2){ toast('Password tidak sama', 'error'); return; } if (p1.length < 3){ toast('Password minimal 3', 'error'); return; } }
    markLocal();
    s.adminUser = u; if (p1) s.adminPass = p1;
    saveDB(); push({ type: 'saveSettings', row: settingsRow() });
    $('#setPass').value = ''; $('#setPass2').value = '';
    toast('Akun diperbarui', 'success');
  });
  $('#btnUploadLogo').addEventListener('click', function(){ $('#logoFile').click(); });
  $('#logoFile').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    if (f.size > 900 * 1024){ toast('Maksimal 900KB', 'error'); return; }
    var r = new FileReader();
    r.onload = function(ev){ markLocal(); s.kop.logo = ev.target.result; saveDB(); toast('Logo diunggah', 'success'); pagePengaturan(c); push({ type: 'saveSettings', row: settingsRow() }); };
    r.readAsDataURL(f);
  });
  $('#btnRemoveLogo').addEventListener('click', function(){ markLocal(); s.kop.logo = ''; saveDB(); toast('Logo dihapus', 'info'); pagePengaturan(c); push({ type: 'saveSettings', row: settingsRow() }); });
  $('#kopUrl').addEventListener('change', function(e){ var u = e.target.value.trim(); if (u){ markLocal(); s.kop.logo = u; saveDB(); toast('Logo disimpan', 'success'); pagePengaturan(c); push({ type: 'saveSettings', row: settingsRow() }); } });
  $('#btnSaveKop').addEventListener('click', function(){
    markLocal();
    s.kop.line1 = $('#kop1').value.trim(); s.kop.line2 = $('#kop2').value.trim(); s.kop.line3 = $('#kop3').value.trim();
    saveDB(); push({ type: 'saveSettings', row: settingsRow() });
    toast('Kop disimpan', 'success');
  });
}

/* ================================================================
   BOOT
   ================================================================ */
function boot(){
  try {
    DB = loadCache();
    DB = migrate(DB);
    DB.session = loadSession();
    applyTheme();

    var curState = history.state;
    if (!curState || curState.app !== 'odhj'){
      if (DB.session.role && DB.session.role !== 'user'){
        history.replaceState({ app: 'odhj', role: 'user', page: null, depth: 0 }, '');
        history.pushState({ app: 'odhj', role: DB.session.role, page: DB.session.page || null, depth: 1 }, '');
      } else {
        history.replaceState({ app: 'odhj', role: 'user', page: null, depth: 0 }, '');
        DB.session = { role: 'user', page: null };
        persistSession();
      }
    } else {
      DB.session = { role: curState.role || 'user', page: curState.page || null };
      persistSession();
    }
    render();
  } catch (e){
    console.error('boot error:', e);
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<div style="padding:40px;color:#e9eefb;font-family:sans-serif"><h2 style="color:#ef4444">Gagal boot</h2><pre style="background:#1a1a2e;padding:14px;border-radius:10px">' + esc(String(e && e.message || e)) + '</pre></div>';
    return;
  }

  setTimeout(initSupabase, 60);

  try {
    window.addEventListener('storage', function(e){
      if (e.key === LS_SESS){ DB.session = loadSession(); render(); }
      else if (e.key === LS_KEY){
        try {
          var fresh = migrate(JSON.parse(e.newValue || '{}'));
          DB.guru = fresh.guru || DB.guru; DB.absensi = fresh.absensi || DB.absensi; DB.settings = fresh.settings || DB.settings;
          softRefresh();
        } catch (err){}
      }
    });
  } catch (e){}

  window.addEventListener('online', function(){ if (sb){ flushQueue().then(function(){ return loadAll(false); }); } });

  document.addEventListener('keydown', function(e){
    var t = e.target;
    var tag = (t && t.tagName || '').toLowerCase();
    var isField = ['input','textarea','select'].indexOf(tag) !== -1 || (t && t.isContentEditable);
    if (e.key === 'Backspace' && !isField && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey){ e.preventDefault(); goBack(); return; }
    if (e.key === 'Escape'){
      var modals = $$('.modal-bg');
      if (modals.length){ modals.forEach(function(m){ m.remove(); }); e.preventDefault(); return; }
      if (!isField){ e.preventDefault(); goBack(); }
      return;
    }
  });

  window.addEventListener('popstate', function(e){
    closeModal();
    var st = e.state;
    if (st && st.app === 'odhj'){
      DB.session = { role: st.role || 'user', page: st.page || null };
      persistSession(); render();
    }
  });
}

boot();

})();
</script>
</body>
</html>
